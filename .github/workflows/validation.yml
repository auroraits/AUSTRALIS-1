name: AUSTRALIS validation

on:
  pull_request:
  push:
    branches:
      - main
      - "audit/**"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and analysis regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate controlled indexes and syntax
        run: python tools/validate_repository.py
      - name: Validate power ledger
        run: python 03_Power/power_budget.py --self-test
      - name: Validate RF calculations
        run: python docs/COMMS/rf_calculations.py --self-test
      - name: Validate EPS non-fabricable placeholder
        run: python 03_Power/EPS_PCB/EPS_Bench2S_FlightLike/validate_eps_placeholder.py
      - name: Validate preliminary simulator regressions
        run: python 05_Software/SIM/validate_simulation.py
      - name: Validate 433 MHz bench invariants
        run: python 05_Software/embedded/scripts/validate_telemetry_bench.py
      - name: Test deterministic AI supervisor
        run: python -m unittest discover -s "05_Software/AI PAYLOAD/tests" -p "test_*.py"
      - name: Parse quarantined PowerShell diagnostic
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "05_Software/AI PAYLOAD/OllamaBenchmark_CubeSat_v5.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  ground:
    name: Ground dashboard build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Release configuration
        run: >-
          dotnet test
          05_Software/GroundTelemetryDashboard/GroundTelemetryDashboard.sln
          --configuration Release

  firmware:
    name: PlatformIO firmware builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19
      - name: Build ESP32-S3 transmitter
        working-directory: 05_Software/embedded/esp32_s3_tx_telemetry
        run: >-
          python -m platformio run
          -e esp32s3_supermini_tx
      - name: Build Uno receiver
        working-directory: 05_Software/embedded/uno_rx_logger
        run: >-
          python -m platformio run
          -e uno_rx_logger
